[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awg-program-participation"
version = "0.1.0"
description = "AWG client-project analysis, launch-window metrics, and interaction regression"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4",
  "statsmodels>=0.14,<0.15", "openpyxl>=3.1,<4", "seaborn>=0.13,<0.14"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[project.scripts]
awg-analyze = "awg_analysis.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
